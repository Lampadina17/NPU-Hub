server:
  port: ${SERVER_PORT:11434}

spring:
  application:
    name: npu-hub
  mvc:
    async:
      request-timeout: 600000
  web:
    resources:
      static-locations: classpath:/static/

npu:
  ollama:
    compatibility-version: 0.20.0-npuhub.17
    default-context: 4096
    minimum-loaded-context: 4096
    default-max-tokens: 4096
    default-keep-alive: -1
    keep-alive-scan-ms: 1000

logging:
  level:
    root: WARN
    com.npuhub: WARN
